<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" role="img" aria-label="ODD">
  <defs>
    <linearGradient id="oddGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c98a"/>
      <stop offset="1" stop-color="#b98d4f"/>
    </linearGradient>
  </defs>
  <!-- O -->
  <circle cx="24" cy="24" r="15" fill="none" stroke="url(#oddGold)" stroke-width="4"/>
  <!-- D -->
  <path d="M48 9 h8 a15 15 0 0 1 0 30 h-8 z" fill="none" stroke="url(#oddGold)" stroke-width="4" stroke-linejoin="round"/>
  <!-- second D (offset baseline = "odd" feel) -->
  <path d="M82 15 h8 a15 15 0 0 1 0 30 h-8 z" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="4" stroke-linejoin="round"/>
  <!-- accent dot -->
  <circle cx="122" cy="38" r="4" fill="url(#oddGold)"/>
</svg>
